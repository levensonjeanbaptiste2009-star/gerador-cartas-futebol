name: Gerar cartas de jogadores

on:
  workflow_dispatch:
    inputs:
      build_list:
        description: "1) Montar/atualizar o players.csv a partir do clubs.csv (Wikidata)"
        type: boolean
        default: false
      team:
        description: "Processar só este clube (nome igual ao da coluna team; vazio = todos)"
        type: string
        default: ""
      max_per_run:
        description: "Máximo de cartas por execução (0 = sem limite)"
        type: string
        default: "300"
      force:
        description: "Refazer cartas que já existem?"
        type: boolean
        default: false

permissions:
  contents: write   # necessário para commitar as imagens geradas

concurrency:
  group: generate-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Fontes do sistema
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Cache dos modelos do rembg
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-models-isnet-v1

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Montar players.csv a partir dos clubes
        if: ${{ inputs.build_list || hashFiles('players.csv') == '' }}
        run: python build_players.py

      - name: Gerar cartas
        env:
          FORCE: ${{ inputs.force }}
          TEAM: ${{ inputs.team }}
          MAX_PER_RUN: ${{ inputs.max_per_run }}
        run: python main.py

      - name: Commitar resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f players.csv ] && git add players.csv || true
          [ -d output ] && git add output || true
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "chore: cartas geradas automaticamente"
            git pull --rebase
            git push
          fi
